name: CI

on:
  push:
    branches:
    - main
    tags:
    - '*'
  pull_request:
  schedule:
    - cron: '0 6 * * 1,4'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build and test

    runs-on: ${{ matrix.os }}

    env:
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      DUNE_RELEASE_GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      TERM: dumb
      OPAMYES: 1

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
        ocaml-compiler:
          - 5.5.2

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '1' }}

      - name: Find Homebrew libpq
        if: runner.os == 'macOS'
        run: echo "PKG_CONFIG_PATH=$(brew --prefix)/opt/libpq/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install Oniguruma
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libonig-dev

      - name: List pins
        id: pins
        shell: bash
        run: |
          {
            echo 'list<<EOF'
            make -s pin-list
            echo EOF
            echo "extras=$(make -s dev-packages)"
          } >> "$GITHUB_OUTPUT"

      - name: Setup OCaml and dependencies
        uses: ml-in-barcelona/gh-ci-action@v1.1.0
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          pins: ${{ steps.pins.outputs.list }}
          extra-packages: ${{ steps.pins.outputs.extras }}
          with-doc: true
          with-dev-setup: false

      # The opam cache of another pin list can be restored, and a new pin does not
      # rebuild ache: rebuild it when its META names another commit than the pin.
      - name: Rebuild ache at its pin
        shell: bash
        run: |
          pin=$(make -s pin-list | awk '$1 == "ache" { sub(/.*#/, "", $2); print $2 }')
          built=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$(opam var lib)/ache/META")
          if [[ -z "$built" || "$pin" != "$built"* ]]; then
            echo "ache was built at '$built', the pin is $pin: rebuilding"
            opam reinstall -y ache ache-lwt
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Load dune cache
        uses: ml-in-barcelona/gh-ci-action/dune-cache/load@v1.1.0

      - name: Build
        run: make build

      - name: Run tests
        run: make test

      - name: Check bundle size
        run: make size

      - name: Save dune cache
        uses: ml-in-barcelona/gh-ci-action/dune-cache/save@v1.1.0

      - name: Install benchmark tools
        if: matrix.os == 'ubuntu-latest' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        run: |
          sudo apt-get install -y wrk
          npx playwright-core install --with-deps --only-shell chromium

      - name: Check page measurements
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        run: |
          make measure-pages
          make bench-check BENCH_CHECKS=pages

      - name: Check benchmarks
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/main'
        run: make bench-gate

      - name: Upload build artifacts
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            _build/
            _opam/
          retention-days: 1
