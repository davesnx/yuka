name: CI

on:
  push:
    branches:
    - main
    tags:
    - '*'
  pull_request:
  schedule:
    - cron: '0 6 * * 1,4'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build and test

    runs-on: ${{ matrix.os }}

    env:
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      DUNE_RELEASE_GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      TERM: dumb
      OPAMYES: 1

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
        ocaml-compiler:
          - 5.4.0

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '1' }}

      - name: List pins
        id: pins
        shell: bash
        run: |
          {
            echo 'list<<EOF'
            make -s pin-list
            echo EOF
            echo "extras=$(make -s dev-packages)"
          } >> "$GITHUB_OUTPUT"

      - name: Setup OCaml and dependencies
        uses: ml-in-barcelona/gh-ci-action@v1.1.0
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          pins: ${{ steps.pins.outputs.list }}
          extra-packages: ${{ steps.pins.outputs.extras }}
          with-doc: true
          with-dev-setup: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Load dune cache
        uses: ml-in-barcelona/gh-ci-action/dune-cache/load@v1.1.0

      - name: Build
        run: make build

      - name: Run tests
        run: make test

      - name: Check bundle size
        run: make size

      - name: Save dune cache
        uses: ml-in-barcelona/gh-ci-action/dune-cache/save@v1.1.0

      - name: Upload build artifacts
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            _build/
            _opam/
          retention-days: 1
